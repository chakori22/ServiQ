<svg width="100%" height="100%" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Soft Background Circles -->
  <circle cx="200" cy="150" r="125" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="95" fill="#FFFFFF" opacity="0.6"/>

  <!-- Main House / Service Frame -->
  <g filter="url(#shadow)">
    <!-- House Base Structure -->
    <path d="M 200 70 L 280 130 V 220 C 280 225.5 275.5 230 270 230 H 130 C 124.5 230 120 225.5 120 220 V 130 Z" fill="#FFFFFF"/>
    <!-- Roof -->
    <path d="M 191 58 L 285 128 C 288 130 288 134 285 136 L 279 142 C 277 144 273 144 271 142 L 200 89 L 129 142 C 127 144 123 144 121 142 L 115 136 C 112 134 112 130 115 128 L 209 58 C 204 53 196 53 191 58 Z" fill="url(#primaryGrad)"/>
  </g>

  <!-- Crossed Tools Emblem in Center -->
  <g filter="url(#badgeShadow)">
    <!-- Adjustable Wrench -->
    <path d="M 165 135 L 215 185 C 218 188 223 188 226 185 L 230 181 C 233 178 233 173 230 170 L 180 120 C 185 110 180 98 168 95 C 158 92 147 98 143 108 L 158 123 L 152 129 L 137 114 C 133 124 138 136 148 140 C 154 142 160 140 165 135 Z" fill="url(#accentGrad)"/>
    
    <!-- Screwdriver -->
    <path d="M 225 125 L 178 172 C 175 175 170 175 167 172 L 163 168 C 160 165 160 160 163 157 L 210 110 Z" fill="#64748B"/>
    <path d="M 215 120 L 232 103 C 235 100 240 100 243 103 L 247 107 C 250 110 250 115 247 118 L 230 135 Z" fill="#334155"/>
    <rect x="238" y="93" width="12" height="6" rx="2" fill="#94A3B8" transform="rotate(45 238 93)"/>
  </g>

  <!-- Service Category Badges -->
  
  <!-- 1. Electrician Badge (Top Left) -->
  <g transform="translate(85, 80)" filter="url(#badgeShadow)">
    <circle cx="22" cy="22" r="22" fill="#FEF08A"/>
    <path d="M 24 9 L 13 24 H 22 L 19 35 L 31 19 H 22 Z" fill="#CA8A04"/>
  </g>

  <!-- 2. Plumber Badge (Top Right) -->
  <g transform="translate(265, 80)" filter="url(#badgeShadow)">
    <circle cx="22" cy="22" r="22" fill="#BFDBFE"/>
    <path d="M 22 10 C 22 10 12 22 12 28 C 12 33.5 16.5 38 22 38 C 27.5 38 32 33.5 32 28 C 32 22 22 10 22 10 Z" fill="#1D4ED8"/>
    <circle cx="18" cy="26" r="2" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- 3. Mechanic/Repair Badge (Bottom Left) -->
  <g transform="translate(90, 185)" filter="url(#badgeShadow)">
    <circle cx="22" cy="22" r="22" fill="#DCFCE7"/>
    <path d="M 22 13 L 24 16 H 27 L 29 14 L 32 17 L 30 19 V 23 L 32 25 L 29 28 L 27 26 H 24 L 22 29 L 19 26 H 17 L 15 28 L 12 25 L 14 23 V 19 L 12 17 L 15 14 L 17 16 H 19 Z M 22 18 A 4 4 0 1 0 22 26 A 4 4 0 1 0 22 18" fill="#15803D"/>
  </g>

  <!-- 4. Cleaning Service Badge (Bottom Right) -->
  <g transform="translate(260, 185)" filter="url(#badgeShadow)">
    <circle cx="22" cy="22" r="22" fill="#F3E8FF"/>
    <!-- Broom Icon -->
    <path d="M 28 11 L 23 16 M 25 14 L 17 22 M 13 26 L 19 32 L 24 27 L 18 21 Z" stroke="#7E22CE" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 13 26 L 9 33 C 8 35 11 37 13 36 L 19 32 Z" fill="#A855F7"/>
  </g>

  <!-- Sparkles & Quality Elements -->
  <path d="M 200 25 L 202.5 32 L 209 34.5 L 202.5 37 L 200 44 L 197.5 37 L 191 34.5 L 197.5 32 Z" fill="#F59E0B"/>
  <path d="M 330 150 L 331.5 154.5 L 336 156 L 331.5 157.5 L 330 162 L 328.5 157.5 L 324 156 L 328.5 154.5 Z" fill="#3B82F6"/>
  <path d="M 70 150 L 71.5 154.5 L 76 156 L 71.5 157.5 L 70 162 L 68.5 157.5 L 64 156 L 68.5 154.5 Z" fill="#10B981"/>
</svg>
